name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.17"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked backend dependencies
        run: uv sync --locked --package linksifty --group dev
      - name: Backend tests (mocked integrations)
        run: uv run --locked --package linksifty pytest backend/tests
      - name: Strict types
        run: uv run --locked --package linksifty mypy --strict backend/src
      - name: Ruff lint
        run: uv run --locked --package linksifty ruff check .
      - name: Ruff formatting
        run: uv run --locked --package linksifty ruff format --check .

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Frontend lint
        run: npm run lint
      # C6.1 adds the test script. Once present, a failed test fails this job.
      - name: Frontend tests (when C6.1 adds the runner)
        run: npm run test --if-present
      - name: Production build
        run: npm run build

  container:
    name: Backend container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build locked production image
        run: docker build --tag linksifty-smoke .
      - name: Verify runtime port, health, authentication and non-root user
        run: |
          docker run --detach --name linksifty-smoke --publish 127.0.0.1:8123:8123 --env PORT=8123 linksifty-smoke
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:8123/health --output /tmp/linksifty-health.json
          python3 -c 'import json; assert json.load(open("/tmp/linksifty-health.json")) == {"status": "ok"}'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8123/v1/items)" = "401"
          test "$(docker exec linksifty-smoke id -u)" = "10001"
          test "$(docker exec linksifty-smoke sh -c 'test ! -e /app/.env && echo clean')" = "clean"
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker logs linksifty-smoke 2>/dev/null || true
          docker rm --force linksifty-smoke 2>/dev/null || true
