[extend]
useDefault = true

# agent-toolkit:gitleaks start
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "agent-toolkit lock: SHA-256 hashes of vendored skill files, not secrets"
condition = "AND"
regexTarget = "secret"
regexes = ['''^[a-f0-9]{64}$''']
paths = ['''^\.agent/lock\.yaml$''']
# agent-toolkit:gitleaks end
