<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linksifty local QA — fixtures</title></head><body><div id="root"></div><script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import App from '/src/App.tsx';
import '/src/index.css';
const session={access_token:'qa-placeholder',user:{id:'qa-owner'}};
const account={user_id:'qa-owner',email:'owner@example.test',status:'approved',role:'admin',trial_links_used:0,trial_links_remaining:3};
let threshold='60';let limit='10';
const usage=()=>({month:'2026-10-01',spent_usd:'0.018234',reserved_usd:'0.04',limit_usd:limit,remaining_usd:String(Math.max(0,Number(limit)-.058234)),resets_at:'2026-11-01T00:00:00Z'});
const items=[{id:'budget',title:'A link ready to resume after raising its cap',status:'failed',score:null,verdict:null,processing_stage:'budget_exhausted'},{id:'ready',title:'A practical guide to evaluating research',status:'completed',score:78,verdict:'valuable',processing_stage:'completed'}, {id:'waiting',title:'https://example.test/article',original_url:'https://example.test/article',status:'processing',score:null,verdict:null,processing_stage:'analyzing',worker_active:true,updated_at:'2026-10-15T00:00:00Z'},{id:'blocked',title:'https://example.test/subscriber-report',status:'awaiting_manual_content',score:null,verdict:null,processing_stage:'paywalled',failure_reason:'paywalled'}];
window.fetch=async(url,options={})=>{
 const path=new URL(url,location.href).pathname;
 let data;
 if(path.endsWith('/v1/me'))data=account;
 else if(path.endsWith('/v1/activity'))return new Response(new ReadableStream({start(controller){controller.enqueue(new TextEncoder().encode(`event: snapshot\ndata: ${JSON.stringify({items,usage:usage()})}\n\n`));options.signal?.addEventListener('abort',()=>controller.close(),{once:true});}}),{headers:{'Content-Type':'text/event-stream'}});
 else if(path.endsWith('/usage')){if(options.method==='PUT')limit=JSON.parse(options.body).limit_usd;data=usage();}
 else if(path.endsWith('/v1/settings')){if(options.method==='PUT')threshold=JSON.parse(options.body).valuable_threshold;data={valuable_threshold:threshold};}
 else if(path.endsWith('/v1/admin/accounts'))data=[{...account,created_at:'2026-10-01T00:00:00Z',approval_email_status:null,approval_email_failure_code:null}];
 else if(path.endsWith('/content') && options.method==='PUT'){const id=path.split('/').at(-2);const item=items.find(item=>item.id===id);item.status='completed';item.processing_stage='completed';item.score=72;item.verdict='valuable';data=item;}
 else if(path.endsWith('/resume') && options.method==='POST'){const id=path.split('/').at(-2);const item=items.find(item=>item.id===id);item.status='processing';item.processing_stage='analyzing';item.worker_active=true;data=item;}
 else if(path.endsWith('/assessment'))data={note:'This guide provides testable evidence and reproducible examples.',score:78,verdict:'valuable',threshold_snapshot:60,criteria:['novelty','evidence','practicality','source_credibility','replicability','independent_corroboration','absence_of_conflict_of_interest','concreteness'].map(name=>({name,score:4,rationale:'The source includes a worked example.',citation_ids:['passage']})),citations:[{id:'passage',excerpt:'Compare claims against the actual experiment.',source_url:'https://example.test/article'}]};
 else data={items};
 return new Response(JSON.stringify(data),{headers:{'Content-Type':'application/json'}});
};
let listener;
const client={auth:{getSession:async()=>({data:{session},error:null}),onAuthStateChange:cb=>{listener=cb;return{data:{subscription:{unsubscribe(){}}}}},signOut:async()=>{listener?.('SIGNED_OUT',null);return{error:null}}}};
createRoot(document.getElementById('root')).render(React.createElement(App,{client}));
</script></body></html>
