[project]
name = "linksifty"
version = "0.1.0"
description = "Linksifty turns saved links into source-grounded notes and a repeatable value verdict."
readme = "README.md"
authors = [
    { name = "Filip Mazurkiewicz", email = "fifmazurkiewicz@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
linksifty = "linksifty:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["linksifty"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".agent", ".agents", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
